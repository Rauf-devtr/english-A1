<html lang="tr">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A1 İngilizce · Kelime Öğren</title>
<style>
  :root{
    --bg:#0D0F14;
    --surface:#161922;
    --surface-2:#1E222D;
    --border: rgba(255,255,255,.08);
    --text:#F3F4F7;
    --text-soft:#8A93A6;
    --amber:#FDB750;
    --amber-soft: rgba(253,183,80,.14);
    --mint:#34D399;
    --coral:#F76E6E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: radial-gradient(1200px 600px at 50% -10%, #191d29 0%, var(--bg) 55%);
    color:var(--text);
    font-family: -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:520px; margin:0 auto; width:100%;
    display:flex; flex-direction:column; flex:1;
    min-height:100vh;
  }

  /* ---- Header ---- */
  header{
    padding:1.4rem 1.2rem .9rem;
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:1rem;
  }
  .brand h1{
    margin:0; font-size:1.28rem; font-weight:700; letter-spacing:-.01em;
  }
  .brand p{
    margin:.3rem 0 0; font-size:.82rem; color:var(--text-soft);
  }
  .stat{
    flex-shrink:0; text-align:right;
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:.5rem .7rem;
  }
  .stat .n{ font-size:1.05rem; font-weight:700; color:var(--amber); line-height:1; }
  .stat .l{ font-size:.66rem; color:var(--text-soft); margin-top:.15rem; }

  main{ flex:1; padding:0 1.2rem 1.4rem; overflow-y:auto; }

  /* ---- Screens ---- */
  .screen{ display:none; }
  .screen.active{ display:block; animation: rise .28s ease; }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  /* ---- Menu tiles ---- */
  .tiles{ display:flex; flex-direction:column; gap:.7rem; margin-top:.4rem; }
  .tile{
    display:flex; align-items:center; gap:.9rem;
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:1rem 1.05rem;
    cursor:pointer; text-align:left; color:var(--text);
    font-family:inherit;
    transition: border-color .15s ease, transform .15s ease;
  }
  .tile:hover{ border-color: rgba(253,183,80,.4); transform: translateY(-1px); }
  .tile:active{ transform: translateY(0); }
  .tile .ico{
    width:42px; height:42px; border-radius:11px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:1.15rem;
  }
  .tile .body{ flex:1; min-width:0; }
  .tile .title{ font-weight:600; font-size:.98rem; }
  .tile .desc{ font-size:.79rem; color:var(--text-soft); margin-top:.15rem; }
  .tile .chev{ color:var(--text-soft); font-size:1.1rem; }

  .tile.study .ico{ background: rgba(253,183,80,.16); color:var(--amber); }
  .tile.test .ico{ background: rgba(52,211,153,.16); color:var(--mint); }
  .tile.repeat .ico{ background: rgba(247,110,110,.16); color:var(--coral); }

  /* ---- Sub-screen top bar ---- */
  .topbar{
    display:flex; align-items:center; gap:.7rem; margin-bottom:1rem; padding-top:.2rem;
  }
  .back{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    width:34px; height:34px; border-radius:10px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:1rem;
    flex-shrink:0;
  }
  .back:hover{ border-color:rgba(255,255,255,.2); }
  .screen-title{ font-size:1.05rem; font-weight:700; margin:0; }

  /* ---- Study list ---- */
  .search-wrap{ position:relative; margin-bottom:1rem; }
  .search-wrap input{
    width:100%; padding:.68rem .9rem .68rem 2.3rem;
    border-radius:12px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:.9rem;
    font-family:inherit;
  }
  .search-wrap input:focus{ outline:none; border-color:var(--amber); }
  .search-wrap::before{
    content:"⌕"; position:absolute; left:.8rem; top:50%; transform:translateY(-50%);
    color:var(--text-soft); font-size:1.05rem;
  }
  .word-list{ list-style:none; margin:0; padding:0; }
  .word-list li{
    display:flex; align-items:center; gap:.8rem;
    padding:.72rem .1rem;
    border-bottom:1px solid var(--border);
  }
  .word-list li .idx{
    font-size:.7rem; color:var(--text-soft); width:1.8rem; flex-shrink:0; text-align:right;
  }
  .word-list li .en{ font-weight:600; flex:1; font-size:.95rem; }
  .word-list li .tr{ color:var(--mint); font-size:.88rem; text-align:right; }
  .empty-note{ color:var(--text-soft); font-size:.85rem; text-align:center; padding:2rem 0; }

  /* ---- Quiz card ---- */
  .quiz-card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:18px; padding:1.5rem 1.3rem 1.4rem;
  }
  .progress-track{
    height:5px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-bottom:1.1rem;
  }
  .progress-fill{ height:100%; background:var(--amber); border-radius:99px; transition:width .25s ease; }
  .progress-label{
    font-size:.75rem; color:var(--text-soft); display:flex; justify-content:space-between; margin-bottom:.9rem;
  }
  .prompt-word{
    font-size:2.1rem; font-weight:700; letter-spacing:-.01em; text-align:center;
    margin: .6rem 0 1.3rem;
  }
  .answer-row{ display:flex; gap:.55rem; }
  .answer-row input{
    flex:1; padding:.8rem 1rem; font-size:1rem; border-radius:12px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    font-family:inherit;
  }
  .answer-row input:focus{ outline:none; border-color:var(--amber); }
  .answer-row button{
    padding:.8rem 1.1rem; border-radius:12px; border:none; cursor:pointer;
    background:var(--amber); color:#1A1300; font-weight:700; font-size:.9rem;
    font-family:inherit;
  }
  .answer-row button:disabled{ opacity:.5; }
  .feedback{
    margin-top:.9rem; min-height:1.3rem; font-size:.92rem; font-weight:600; text-align:center;
  }
  .feedback.correct{ color:var(--mint); }
  .feedback.wrong{ color:var(--coral); }

  .quiz-footer{
    display:flex; justify-content:center; margin-top:1.2rem;
  }
  .quiz-footer button{
    background:none; border:none; color:var(--text-soft); cursor:pointer;
    font-family:inherit; font-size:.8rem; text-decoration:underline;
    text-underline-offset:3px;
  }
  .quiz-footer button:hover{ color:var(--text); }

  /* ---- Result ---- */
  .result-box{ text-align:center; padding:2.2rem 1rem 1rem; }
  .result-box .tag{ font-size:.8rem; color:var(--text-soft); }
  .result-box .score{
    font-size:3rem; font-weight:800; margin:.5rem 0; letter-spacing:-.02em;
  }
  .result-box .score .of{ color:var(--text-soft); font-size:1.6rem; font-weight:600; }
  .result-box .breakdown{ font-size:.85rem; color:var(--text-soft); }
  .result-box .restart{
    margin-top:1.4rem; padding:.75rem 1.4rem; border-radius:12px; border:none;
    background:var(--amber); color:#1A1300; font-weight:700; font-size:.9rem; cursor:pointer;
    font-family:inherit;
  }

  @media (prefers-reduced-motion: reduce){
    .tile{ transition:none; }
    .screen.active{ animation:none; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <h1>A1 İngilizce</h1>
      <p>Kelime öğren, test et, pekiştir.</p>
    </div>
    <div class="stat">
      <div class="n" id="wordCountNum"></div>
      <div class="l">kelime</div>
    </div>
  </header>

  <main>
    <!-- MENU -->
    <section class="screen active" id="screen-menu">
      <div class="tiles">
        <button class="tile study" data-mode="study">
          <span class="ico">📖</span>
          <span class="body">
            <span class="title">Kelimelere Çalış</span>
            <span class="desc">Tüm listeyi İngilizce – Türkçe incele</span>
          </span>
          <span class="chev">›</span>
        </button>
        <button class="tile test" data-mode="test">
          <span class="ico">✎</span>
          <span class="body">
            <span class="title">İngilizce → Türkçe Test</span>
            <span class="desc">Karışık sırayla sorulur, skorunu gör</span>
          </span>
          <span class="chev">›</span>
        </button>
        <button class="tile repeat" data-mode="repeat">
          <span class="ico">↻</span>
          <span class="body">
            <span class="title">Türkçe → İngilizce Tekrar</span>
            <span class="desc">Doğru yazana kadar aynı kelime döner</span>
          </span>
          <span class="chev">›</span>
        </button>
      </div>
    </section>

    <!-- STUDY -->
    <section class="screen" id="screen-study">
      <div class="topbar">
        <button class="back" data-back>←</button>
        <p class="screen-title">Kelimelere Çalış</p>
      </div>
      <div class="search-wrap">
        <input type="text" id="studySearch" placeholder="Kelime ara...">
      </div>
      <ul class="word-list" id="studyList"></ul>
    </section>

    <!-- TEST EN->TR -->
    <section class="screen" id="screen-test">
      <div class="topbar">
        <button class="back" data-back>←</button>
        <p class="screen-title">İngilizce → Türkçe</p>
      </div>
      <div id="testArea"></div>
    </section>

    <!-- REPEAT TR->EN -->
    <section class="screen" id="screen-repeat">
      <div class="topbar">
        <button class="back" data-back>←</button>
        <p class="screen-title">Türkçe → İngilizce</p>
      </div>
      <div id="repeatArea"></div>
    </section>
  </main>

</div>

const wordEntries = Object.entries(WORDS);
document.getElementById('wordCountNum').textContent = wordEntries.length;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function clean(text){ return text.trim().toLowerCase(); }

/* Bir kelimenin birden fazla doğru karşılığı olabilir (ör: "ders/sınıf" veya
   "o (erkek)"). Bu fonksiyon, o karşılıklardan herhangi birini yazınca doğru
   sayılabilmesi için kabul edilebilir tüm varyantları üretir. */
function acceptableAnswers(raw){
  const variants = new Set();
  raw.split('/').forEach(part=>{
    const withParens = clean(part);
    if(withParens) variants.add(withParens);
    const noParens = clean(part.replace(/\([^)]*\)/g, ''));
    if(noParens) variants.add(noParens);
  });
  return variants;
}
function isCorrectAnswer(userInput, correctRaw){
  return acceptableAnswers(correctRaw).has(clean(userInput));
}

const screens = {
  menu: document.getElementById('screen-menu'),
  study: document.getElementById('screen-study'),
  test: document.getElementById('screen-test'),
  repeat: document.getElementById('screen-repeat'),
};
function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
  if(name === 'test') startTest();
  if(name === 'repeat') startRepeat();
  if(name === 'study'){ document.getElementById('studySearch').value=''; renderStudyList(''); }
}

document.querySelectorAll('.tile').forEach(btn=>{
  btn.addEventListener('click', ()=> showScreen(btn.dataset.mode));
});
document.querySelectorAll('[data-back]').forEach(btn=>{
  btn.addEventListener('click', ()=> showScreen('menu'));
});

/* ---------- STUDY MODE ---------- */
function renderStudyList(filter){
  const listEl = document.getElementById('studyList');
  const f = clean(filter);
  listEl.innerHTML = '';
  let shown = 0;
  wordEntries.forEach(([en,tr], i)=>{
    if(f && !en.toLowerCase().includes(f) && !tr.toLowerCase().includes(f)) return;
    shown++;
    const li = document.createElement('li');
    li.innerHTML = `<span class="idx">${i+1}</span><span class="en">${en}</span><span class="tr">${tr}</span>`;
    listEl.appendChild(li);
  });
  if(shown === 0){
    listEl.innerHTML = '<div class="empty-note">Eşleşen kelime bulunamadı.</div>';
  }
}
document.getElementById('studySearch').addEventListener('input', (e)=>{
  renderStudyList(e.target.value);
});

/* ---------- TEST MODE (EN -> TR) ---------- */
let testQueue = [], testIndex = 0, testScore = 0, testTotal = 0;

function startTest(){
  testQueue = shuffle(wordEntries);
  testIndex = 0; testScore = 0; testTotal = 0;
  renderTestQuestion();
}

function renderTestQuestion(){
  const area = document.getElementById('testArea');
  if(testIndex >= testQueue.length){ renderTestResult(); return; }
  const [en, tr] = testQueue[testIndex];
  const pct = Math.round((testIndex / testQueue.length) * 100);
  area.innerHTML = `
    <div class="quiz-card">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label"><span>Soru ${testIndex+1} / ${testQueue.length}</span><span>Doğru: ${testScore}</span></div>
      <div class="prompt-word">${en.toUpperCase()}</div>
      <div class="answer-row">
        <input type="text" id="testInput" placeholder="Türkçe karşılığını yaz..." autocomplete="off">
        <button id="testSubmit">Gönder</button>
      </div>
      <div class="feedback" id="testFeedback"></div>
    </div>
    <div class="quiz-footer"><button id="testQuit">Testi bitir</button></div>
  `;
  const input = document.getElementById('testInput');
  input.focus();
  const submit = ()=>{
    const val = clean(input.value);
    if(!val) return;
    testTotal++;
    const fb = document.getElementById('testFeedback');
    if(isCorrectAnswer(val, tr)){
      testScore++;
      fb.textContent = '✓ Doğru!';
      fb.className = 'feedback correct';
    } else {
      fb.textContent = '✗ Yanlış! Doğru cevap: ' + tr.split('/').map(s=>s.trim()).join(' veya ');
      fb.className = 'feedback wrong';
    }
    document.getElementById('testSubmit').disabled = true;
    input.disabled = true;
    setTimeout(()=>{ testIndex++; renderTestQuestion(); }, 900);
  };
  document.getElementById('testSubmit').addEventListener('click', submit);
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submit(); });
  document.getElementById('testQuit').addEventListener('click', renderTestResult);
}

function renderTestResult(){
  const area = document.getElementById('testArea');
  area.innerHTML = `
    <div class="result-box">
      <div class="tag">Test Bitti</div>
      <div class="score">${testScore}<span class="of"> / ${testTotal}</span></div>
      <div class="breakdown">Toplam soru: ${testTotal} · Doğru sayısı: ${testScore}</div>
      <button class="restart" id="testRestart">Yeniden Başla</button>
    </div>
  `;
  document.getElementById('testRestart').addEventListener('click', startTest);
}

/* ---------- REPEAT MODE (TR -> EN, until correct) ---------- */
let repeatTarget = null, repeatPrompt = null, repeatAttempts = 0;

function pickRepeatWord(){
  const [en, tr] = wordEntries[Math.floor(Math.random()*wordEntries.length)];
  repeatTarget = en; repeatPrompt = tr; repeatAttempts = 0;
}
function startRepeat(){ pickRepeatWord(); renderRepeatQuestion(); }

function renderRepeatQuestion(){
  const area = document.getElementById('repeatArea');
  area.innerHTML = `
    <div class="quiz-card">
      <div class="progress-label"><span>Doğru bilene kadar tekrar</span><span>${repeatAttempts > 0 ? 'Deneme ' + repeatAttempts : ''}</span></div>
      <div class="prompt-word">${repeatPrompt.toUpperCase()}</div>
      <div class="answer-row">
        <input type="text" id="repeatInput" placeholder="İngilizce karşılığını yaz..." autocomplete="off">
        <button id="repeatSubmit">Gönder</button>
      </div>
      <div class="feedback" id="repeatFeedback"></div>
    </div>
    <div class="quiz-footer"><button id="repeatSkip">Yeni kelime</button></div>
  `;
  const input = document.getElementById('repeatInput');
  input.focus();
  const submit = ()=>{
    const val = clean(input.value);
    if(!val) return;
    repeatAttempts++;
    const fb = document.getElementById('repeatFeedback');
    if(isCorrectAnswer(val, repeatTarget)){
      fb.textContent = '✓ Doğru!';
      fb.className = 'feedback correct';
      setTimeout(()=>{ pickRepeatWord(); renderRepeatQuestion(); }, 700);
    } else {
      fb.textContent = '✗ Tekrar dene';
      fb.className = 'feedback wrong';
      input.value = '';
      input.focus();
    }
  };
  document.getElementById('repeatSubmit').addEventListener('click', submit);
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submit(); });
  document.getElementById('repeatSkip').addEventListener('click', ()=>{ pickRepeatWord(); renderRepeatQuestion(); });
}
</script>
</body>
</html>
